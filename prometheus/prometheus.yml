# Prometheus scrape config.
# 60s interval = the 1-minute sampling cadence requested for the
# container CPU/memory/disk trend.  All targets sit on the host network,
# so they are reachable at localhost:<port>.
global:
  scrape_interval: 60s
  evaluation_interval: 60s

scrape_configs:
  # per-container CPU / memory / network / filesystem
  - job_name: cadvisor
    static_configs:
      - targets: ['localhost:8189']

  # host-level CPU / RAM / disk space / disk I/O
  - job_name: node-exporter
    static_configs:
      - targets: ['localhost:9100']

  # Prometheus' own health
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
