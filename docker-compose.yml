# Monitoring stack — cAdvisor + node-exporter + Prometheus + Grafana.
#
# Read-only observability for every Docker container AND the host on
# whatever machine this runs on. No custom images — all upstream, pinned.
#
#   cadvisor       :8189  per-container CPU / memory / net / filesystem
#   node-exporter  :9100  host CPU / RAM / disk space / disk I/O
#   prometheus     :9090  scrapes the two above every 60s, 30d retention
#   grafana        :3000  dashboards (datasource auto-provisioned)
#
# Why host networking: every monitored service already uses it, and it
# lets Prometheus scrape the exporters at plain localhost:<port>.
services:
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: monitoring-cadvisor
    init: true   # tini reaps orphaned HEALTHCHECK wget children (no zombie buildup)
    restart: unless-stopped
    network_mode: host
    privileged: true
    # Image's default healthcheck probes :8080, but we override the port to
    # :8189 (below). On host networking :8080 is another service → 404. Point
    # the probe at the real port so health reflects cAdvisor, not a neighbour.
    environment:
      - CADVISOR_HEALTHCHECK_URL=http://localhost:8189/healthz
    command:
      - '--port=8189'
      # Bind loopback (not the 0.0.0.0 default) — cAdvisor is only scraped by the local
      # Prometheus at localhost:8189, so this keeps scraping working and frees the port on the
      # secondary IPs (.31/.32/.33). Override via CADVISOR_IP.
      - '--listen_ip=${CADVISOR_IP:-0.0.0.0}'
      # 15s housekeeping (vs 1s default) cuts cAdvisor CPU roughly 5x —
      # 60s scrape cadence doesn't need 1s internal sampling.
      - '--housekeeping_interval=15s'
      - '--docker_only=true'
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
      - /etc/localtime:/etc/localtime:ro
    devices:
      - /dev/kmsg
    deploy:
      resources:
        limits:
          memory: 512M

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: monitoring-node-exporter
    restart: unless-stopped
    network_mode: host
    pid: host
    command:
      - '--path.rootfs=/host'
      # Bind the host PRIMARY IP, not the wildcard (:9100). The wildcard shadows every IP on the
      # box — including the IQFeed emulator's dedicated .33/.53 — so the emulator couldn't bind
      # its own :9100. Set NODE_EXPORTER_LISTEN per host (.30 -> 192.168.1.30:9100, .50 -> .50).
      - '--web.listen-address=${NODE_EXPORTER_LISTEN:-:9100}'
    volumes:
      - /:/host:ro,rslave
      - /etc/localtime:/etc/localtime:ro
    deploy:
      resources:
        limits:
          memory: 128M

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: monitoring-prometheus
    restart: unless-stopped
    network_mode: host
    # root so it can write the TSDB into the named volume without a
    # first-run permission-denied crash loop.
    user: root
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      # Bind loopback (not 0.0.0.0) — Prometheus is reached only by the local Grafana at
      # localhost:9090 and by admins; frees :9090 on the secondary IPs. Override via PROM_LISTEN.
      - '--web.listen-address=${PROM_LISTEN:-:9090}'
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
      - /etc/localtime:/etc/localtime:ro
    deploy:
      resources:
        limits:
          memory: 1G

  grafana:
    image: grafana/grafana:11.2.0
    container_name: monitoring-grafana
    restart: unless-stopped
    network_mode: host
    environment:
      - GF_SERVER_HTTP_PORT=3000
      # Bind the host primary IP (not 0.0.0.0) so Grafana stays reachable on <host>:3000 while
      # freeing :3000 on the secondary IPs. Its own datasource call to localhost:9090 is outbound
      # and unaffected. Empty default = all interfaces (backward compat); set GRAFANA_ADDR per host.
      - GF_SERVER_HTTP_ADDR=${GRAFANA_ADDR:-}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/dashboards:ro
      - /etc/localtime:/etc/localtime:ro
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  prometheus-data:
  grafana-data:
